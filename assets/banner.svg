<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #a5b4fc;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Ambient Glowing Orbs (Behind Grid) -->
  <g filter="url(#glow-blur)" opacity="0.65">
    <!-- Top-left Purple Orb -->
    <circle cx="220" cy="90" r="140" fill="#6366f1">
      <animate attributeName="cx" values="220;260;180;220" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;130;70;90" dur="11s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;165;130;140" dur="13s" repeatCount="indefinite" />
    </circle>
    <!-- Right Pink/Magenta Orb -->
    <circle cx="980" cy="180" r="160" fill="#ec4899">
      <animate attributeName="cx" values="980;940;1020;980" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="180;240;140;180" dur="12s" repeatCount="indefinite" />
      <animate attributeName="r" values="160;180;145;160" dur="15s" repeatCount="indefinite" />
    </circle>
    <!-- Center Cyan Orb -->
    <circle cx="620" cy="320" r="130" fill="#06b6d4">
      <animate attributeName="cx" values="620;680;560;620" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="320;280;350;320" dur="13s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.75;0.45;0.5" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- High-Tech Grid Pattern -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Circuit / Wave Nodes Layer -->
  <g opacity="0.35">
    <path d="M 50 360 Q 300 320 600 360 T 1150 340" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;200" dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M 80 80 Q 400 140 800 60 T 1120 110" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="15s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Pulsing Target Radar in Top-Right Corner -->
  <g transform="translate(1060, 90)" opacity="0.45">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#c084fc" stroke-width="1">
      <animate attributeName="r" values="20;32;20" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
  </g>

  <!-- Live Benchmark Pulse Card (Bottom Right Floating Glass Card) -->
  <g transform="translate(860, 260)">
    <rect width="280" height="115" rx="14" fill="url(#card-grad)" stroke="#4338ca" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="28" cy="30" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="44" y="34" class="stat-label" font-weight="700" fill="#f8fafc">SYSTEMS BENCHMARKED</text>
    
    <!-- Mini Metric Bars -->
    <g transform="translate(26, 52)">
      <!-- Reasoning -->
      <rect x="0" y="0" width="70" height="6" rx="3" fill="#334155" />
      <rect x="0" y="0" width="62" height="6" rx="3" fill="#6366f1">
        <animate attributeName="width" values="55;65;55" dur="4s" repeatCount="indefinite" />
      </rect>
      <text x="80" y="7" class="tagline-text" font-size="11">Reasoning &amp; Math (98%)</text>
      
      <!-- Tool & Coding -->
      <rect x="0" y="16" width="70" height="6" rx="3" fill="#334155" />
      <rect x="0" y="16" width="58" height="6" rx="3" fill="#06b6d4">
        <animate attributeName="width" values="45;60;45" dur="5s" repeatCount="indefinite" />
      </rect>
      <text x="80" y="23" class="tagline-text" font-size="11">Agent Tool-Use (92%)</text>

      <!-- Faithfulness -->
      <rect x="0" y="32" width="70" height="6" rx="3" fill="#334155" />
      <rect x="0" y="32" width="65" height="6" rx="3" fill="#ec4899">
        <animate attributeName="width" values="58;68;58" dur="4.5s" repeatCount="indefinite" />
      </rect>
      <text x="80" y="39" class="tagline-text" font-size="11">RAG Faithfulness (95%)</text>
    </g>
  </g>

  <!-- FOREGROUND: TITLE, SUBTITLE & METRICS (Crisp, High Contrast, Always Legible) -->
  <g transform="translate(80, 85)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#a855f7" />
      <text x="30" y="19" class="pill-label" font-size="12" fill="#c7d2fe">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="80" class="title-text" fill="url(#primary-glow)">Awesome AI Evaluation</text>
    <text x="0" y="128" class="title-text" fill="#ffffff">&amp; Model Benchmarking</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle-text">
      The definitive index of Foundation Model Benchmarks, Agent Harnesses &amp; LLMOps Observability
    </text>

    <!-- Tagline -->
    <text x="0" y="202" class="tagline-text">
      LLM-as-a-Judge • SWE-bench • RAG Faithfulness • Prompt Injection &amp; Red-Teaming • CI/CD Regression Gates
    </text>

    <!-- Interactive/Feature Pills Carousel Row -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: Agentic Harnesses -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="17" fill="url(#pill-grad)" stroke="#475569" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#6366f1" />
        <text x="32" y="22" class="pill-label">Agent Harnesses</text>
      </g>

      <!-- Pill 2: RAG & LLM Judge -->
      <g transform="translate(182, 0)">
        <rect width="180" height="34" rx="17" fill="url(#pill-grad)" stroke="#475569" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#06b6d4" />
        <text x="32" y="22" class="pill-label">LLM-as-a-Judge</text>
      </g>

      <!-- Pill 3: Star-Sorted Open Source -->
      <g transform="translate(374, 0)">
        <rect width="185" height="34" rx="17" fill="url(#pill-grad)" stroke="#475569" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#eab308" />
        <text x="32" y="22" class="pill-label">25+ Open Source Tools</text>
      </g>

      <!-- Pill 4: SaaS Market Sizing -->
      <g transform="translate(571, 0)">
        <rect width="180" height="34" rx="17" fill="url(#pill-grad)" stroke="#475569" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#ec4899" />
        <text x="32" y="22" class="pill-label">SaaS Pricing Matrix</text>
      </g>
    </g>
  </g>
</svg>
